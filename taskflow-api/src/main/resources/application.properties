spring.application.name=taskflow-api
server.port=${PORT:8080}

# Banco de dados (valores padrão servem para desenvolvimento local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow}
spring.datasource.username=${DB_USER:taskflow}
spring.datasource.password=${DB_PASSWORD:taskflow}

# O schema é gerenciado pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Healthcheck para plataformas de deploy
management.endpoints.web.exposure.include=health
